[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-autobuyer"
version = "0.5.3"
description = "macOS Apple Store preparation, website dry run and guarded automation"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.2", "playwright==1.63.0", "keyring==25.7.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pyinstaller>=6.12,<7"]

[project.scripts]
apple-autobuyer = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.gui" = ["*.qss"]
"app.services" = ["*.html", "*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: local browser integration", "live: opt-in Apple website checks"]
