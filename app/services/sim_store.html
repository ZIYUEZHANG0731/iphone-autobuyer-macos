<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本地异常测试 · 不是真实 Apple 商店</title>
<style>body{background:#10141d;color:#e8edf5;font:16px system-ui;margin:40px auto;max-width:800px}h1{font-size:32px}.badge{color:#58dfbb}label{display:block;margin:15px 0}select,input{font:inherit;padding:10px;border:1px solid #485069;border-radius:7px;background:#202738;color:white}button{padding:12px 20px;border:0;border-radius:8px;background:#5ee1bc;color:#10281f;font:inherit;margin:12px 8px 12px 0}.panel{padding:24px;background:#191f2c;border:1px solid #30394b;border-radius:14px;margin-top:20px}.error{color:#ff9c91}small{color:#aab5c6}</style>
<p class="badge">本地异常测试 · 合成商品/价格/身份 · 无法创建真实订单</p><h1 id="title">模拟商店</h1><div id="panel" class="panel"></div><p id="error" role="alert" class="error"></p>
<script>
const panel=document.getElementById('panel'),err=document.getElementById('error');let catalog,chosen={},store,payment,identity;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const r=await fetch(path);if(!r.ok)throw Error(r.status);return r.json()}
function button(name,fn){const b=document.createElement('button');b.textContent=name;b.onclick=async()=>{err.textContent='';try{await fn()}catch(e){err.textContent=e.message}};panel.appendChild(b)}
async function product(){catalog=await api('/api/catalog');document.getElementById('title').textContent=catalog.name;panel.innerHTML='<h2>选择商品</h2><p>模拟单价 RMB 100.00</p>';for(const [k,values]of Object.entries(catalog.options)){const l=document.createElement('label');l.textContent=k;const s=document.createElement('select');s.setAttribute('aria-label',k);for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)}l.appendChild(s);panel.appendChild(l)}const l=document.createElement('label');l.textContent='数量';const s=document.createElement('input');s.type='number';s.value='1';s.min='1';s.max='10';s.setAttribute('aria-label','数量');l.appendChild(s);panel.appendChild(l);button('继续选择门店',async()=>{for(const el of panel.querySelectorAll('select'))chosen[el.getAttribute('aria-label')]=el.value;chosen.quantity=Number(s.value);await stores()})}
async function stores(){const items=await api('/api/stores');panel.innerHTML='<h2>选择自提门店</h2>';for(const item of items){const l=document.createElement('label');const i=document.createElement('input');i.type='radio';i.name='store';i.value=item.id;i.disabled=!item.available;i.setAttribute('aria-label',item.name);i.dataset.name=item.name;i.dataset.city=item.city;i.dataset.date=item.date;i.dataset.quote=item.available?'模拟有货':'模拟无货';l.append(i,document.createTextNode(item.name+' · '+i.dataset.quote));panel.appendChild(l)}button('刷新门店',stores);button('继续填写取货人',()=>{const el=panel.querySelector('input:checked');if(!el)throw Error('请选择可用自提门店');store={name:el.dataset.name,id:el.value};customer()})}
function customer(){panel.innerHTML='<h2>合成取货信息</h2><small>请勿填写真实身份。</small>';for(const [key,name]of Object.entries({name:'取货人姓名',document_type:'证件类型',document_number:'证件号码',phone:'手机号码',email:'电子邮箱'})){const l=document.createElement('label');l.textContent=name;const i=document.createElement('input');i.setAttribute('aria-label',name);i.dataset.key=key;l.appendChild(i);panel.appendChild(l)}button('继续选择付款方式',async()=>{identity=Object.fromEntries([...panel.querySelectorAll('input')].map(i=>[i.dataset.key,i.value]));if(Object.values(identity).some(v=>!v))throw Error('取货信息不完整');if(!identity.document_number.startsWith('TEST-'))throw Error('仅接受合成身份');await payments()})}
async function payments(){const items=await api('/api/payments');panel.innerHTML='<h2>选择付款方式</h2>';for(const name of items){const l=document.createElement('label'),i=document.createElement('input');i.type='radio';i.name='payment';i.value=name;i.setAttribute('aria-label',name);l.append(i,document.createTextNode(name));panel.appendChild(l)}button('继续核对订单',()=>{const i=panel.querySelector('input:checked');if(!i)throw Error('请选择付款方式');payment=i.value;review()})}
function review(){panel.innerHTML='<h2>模拟订单核对</h2>';const info=document.createElement('div');info.setAttribute('data-testid','summary');info.dataset.json=JSON.stringify({product:catalog.name,options:Object.fromEntries(Object.entries(chosen).filter(([k])=>k!=='quantity')),quantity:chosen.quantity,total:(100*chosen.quantity).toFixed(2),store_name:store.name,store_id:store.id,payment,fulfillment:'pickup',currency:'CNY',verified:true});info.textContent=JSON.stringify(JSON.parse(info.dataset.json));panel.appendChild(info);button('提交模拟订单',async()=>{const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:catalog.token,identity})});const result=await r.json();if(!r.ok)throw Error(result.error);const rec=document.createElement('div');rec.setAttribute('data-testid','receipt');rec.dataset.json=JSON.stringify(result.order);rec.textContent='模拟订单创建成功 · 请勿当作真实购买成功';panel.replaceChildren(rec)})}
product().catch(e=>err.textContent=e.message);
</script></html>
